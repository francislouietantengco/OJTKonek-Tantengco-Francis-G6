{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Log in</h1>
  <p class="muted">Welcome back to OJT Konek.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include "accounts/_form_fields.html" %}
    <button type="submit" class="btn btn-block">Log in</button>
  </form>
  <p class="muted center">No account yet? <a href="{% url 'accounts:register' %}">Sign up</a></p>
</div>
{% endblock %}
